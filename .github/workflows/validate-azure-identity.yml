name: Validate Azure Identity Foundation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger this workflow from the GitHub UI

permissions:
  id-token: write # Required for requesting the secure OIDC token from Azure
  contents: read  # Required for checking out your repository files

jobs:
  test-login:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Verify Scoped Resource Group Visibility
      run: |
        echo "Successfully authenticated as an environment automation identity!"
        echo "Checking visibility of the target resource group..."
        az group show --name rg-hfd-healthops-dev --output json
